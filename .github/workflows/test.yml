name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

env:
  BUILD_TAG: pure-ftpd:test
  CONTAINER_NAME: pure-ftpd

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0
      -
        name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: image-local
        env:
          DEFAULT_TAG: ${{ env.BUILD_TAG }}
      -
        name: Prepare TLS
        run: |
          docker compose run --rm --no-deps --entrypoint sh pureftpd -ec '
            openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 1 \
              -subj /CN=localhost -addext subjectAltName=DNS:localhost \
              -keyout /data/pureftpd.pem -out /data/pureftpd.pem
            printf "%s\n" "--tls 2" > /data/pureftpd.flags
          '
        working-directory: test
        env:
          PUREFTPD_IMAGE: ${{ env.BUILD_TAG }}
          PUREFTPD_CONTAINER: ${{ env.CONTAINER_NAME }}
      -
        name: Start
        run: |
          docker compose up -d
        working-directory: test
        env:
          PUREFTPD_IMAGE: ${{ env.BUILD_TAG }}
          PUREFTPD_CONTAINER: ${{ env.CONTAINER_NAME }}
      -
        name: Check container logs
        uses: crazy-max/.github/.github/actions/container-logs-check@46267a6e61cd56aac2fc79943df180152f4c89d6 # v1.10.1
        with:
          name: ${{ env.CONTAINER_NAME }}
          log_check: "[services.d] done"
          timeout: 120
      -
        name: Check TLS
        run: |
          docker exec "${CONTAINER_NAME}" sh -ec '
            printf "QUIT\r\n" | timeout 15 openssl s_client \
              -starttls ftp -connect localhost:2100 -servername localhost \
              -CAfile /data/pureftpd.pem -verify_return_error \
              -verify_hostname localhost -brief
          '
      -
        name: Logs
        if: always()
        run: |
          docker compose logs
        working-directory: test
        env:
          PUREFTPD_IMAGE: ${{ env.BUILD_TAG }}
          PUREFTPD_CONTAINER: ${{ env.CONTAINER_NAME }}
