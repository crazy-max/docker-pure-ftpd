name: test

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'master'
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'

env:
  BUILD_TAG: pure-ftpd:test
  CONTAINER_NAME: pure-ftpd

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: image-local
        env:
          DEFAULT_TAG: ${{ env.BUILD_TAG }}
      -
        name: Prepare TLS
        run: |
          docker compose run --rm --no-deps --entrypoint sh pureftpd -ec '
            openssl req -x509 -nodes -newkey rsa:2048 -sha256 -days 1 \
              -subj /CN=localhost -addext subjectAltName=DNS:localhost \
              -keyout /data/pureftpd.pem -out /data/pureftpd.pem
            printf "%s\n" "--tls 2" > /data/pureftpd.flags
          '
        working-directory: test
        env:
          PUREFTPD_IMAGE: ${{ env.BUILD_TAG }}
          PUREFTPD_CONTAINER: ${{ env.CONTAINER_NAME }}
      -
        name: Start
        run: |
          docker compose up -d
        working-directory: test
        env:
          PUREFTPD_IMAGE: ${{ env.BUILD_TAG }}
          PUREFTPD_CONTAINER: ${{ env.CONTAINER_NAME }}
      -
        name: Check container logs
        uses: crazy-max/.github/.github/actions/container-logs-check@f91220cba053bd54299ba645a599ee8ed436f222 # v1.11.0
        with:
          name: ${{ env.CONTAINER_NAME }}
          log_check: "[services.d] done"
          timeout: 120
      -
        name: Check TLS
        run: |
          docker exec "${CONTAINER_NAME}" sh -ec '
            printf "QUIT\r\n" | timeout 15 openssl s_client \
              -starttls ftp -connect localhost:2100 -servername localhost \
              -CAfile /data/pureftpd.pem -verify_return_error \
              -verify_hostname localhost -brief
          '
      -
        name: Logs
        if: always()
        run: |
          docker compose logs
        working-directory: test
        env:
          PUREFTPD_IMAGE: ${{ env.BUILD_TAG }}
          PUREFTPD_CONTAINER: ${{ env.CONTAINER_NAME }}
